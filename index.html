<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repository Info - dgadgadf</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .repo-name {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .repo-id {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 15px;
        }

        .repo-description {
            font-size: 16px;
            opacity: 0.95;
            font-style: italic;
        }

        .content {
            padding: 40px 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 24px;
            background: #667eea;
            margin-right: 12px;
            border-radius: 2px;
        }

        .chart-container {
            position: relative;
            height: 300px;
            margin-bottom: 30px;
        }

        .language-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .language-item {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .language-color {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .language-info {
            flex: 1;
        }

        .language-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .language-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }

        .language-progress {
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .language-percent {
            font-size: 14px;
            color: #666;
            font-weight: 600;
            min-width: 45px;
            text-align: right;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 13px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        @media (max-width: 600px) {
            .header {
                padding: 30px 20px;
            }

            .repo-name {
                font-size: 24px;
            }

            .content {
                padding: 20px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="repo-name">Robert6814/dgadgadf</div>
            <div class="repo-id">ID: 1344302298</div>
            <div class="repo-description">sdsd</div>
        </div>

        <div class="content">
            <!-- Stats Grid -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value">3</div>
                    <div class="stat-label">Languages</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">80.2%</div>
                    <div class="stat-label">Primary Language</div>
                </div>
            </div>

            <!-- Chart Section -->
            <div class="section">
                <div class="section-title">Language Distribution</div>
                <div class="chart-container">
                    <canvas id="languageChart"></canvas>
                </div>
            </div>

            <!-- Detailed Breakdown -->
            <div class="section">
                <div class="section-title">Language Breakdown</div>
                <div class="language-list">
                    <div class="language-item">
                        <div class="language-color" style="background: #f1e05a;"></div>
                        <div class="language-info">
                            <div class="language-name">JavaScript</div>
                            <div class="language-bar">
                                <div class="language-progress" style="width: 80.2%; background: #f1e05a;"></div>
                            </div>
                        </div>
                        <div class="language-percent">80.2%</div>
                    </div>

                    <div class="language-item">
                        <div class="language-color" style="background: #563d7c;"></div>
                        <div class="language-info">
                            <div class="language-name">CSS</div>
                            <div class="language-bar">
                                <div class="language-progress" style="width: 17.1%; background: #563d7c;"></div>
                            </div>
                        </div>
                        <div class="language-percent">17.1%</div>
                    </div>

                    <div class="language-item">
                        <div class="language-color" style="background: #e34c26;"></div>
                        <div class="language-info">
                            <div class="language-name">HTML</div>
                            <div class="language-bar">
                                <div class="language-progress" style="width: 2.7%; background: #e34c26;"></div>
                            </div>
                        </div>
                        <div class="language-percent">2.7%</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Chart.js - Pie Chart
        const ctx = document.getElementById('languageChart').getContext('2d');
        const languageChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['JavaScript', 'CSS', 'HTML'],
                datasets: [{
                    data: [80.2, 17.1, 2.7],
                    backgroundColor: [
                        '#f1e05a',
                        '#563d7c',
                        '#e34c26'
                    ],
                    borderColor: '#ffffff',
                    borderWidth: 3,
                    borderRadius: 5
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            padding: 20,
                            font: {
                                size: 14,
                                weight: '600'
                            },
                            color: '#333'
                        }
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return context.label + ': ' + context.parsed + '%';
                            }
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>
