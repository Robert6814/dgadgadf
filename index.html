<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vanguard Duel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Intro/Cinematic Screen -->
    <div id="intro-screen" class="screen full-screen">
      <div class="intro-bg"></div>
      <div class="intro-content">
        <div class="intro-logo">VANGUARD</div>
        <div class="intro-tagline">STAND UP, MY VANGUARD</div>
        <div class="intro-glyphs">
          <span class="glyph">◈</span>
          <span class="glyph">◈</span>
          <span class="glyph">◈</span>
        </div>
        <div class="intro-waiting">Waiting for opponent…</div>
      </div>
    </div>

    <div id="status-banner" class="hidden"></div>

    <!-- Mulligan Screen -->
    <div id="mulligan-screen" class="screen hidden">
      <div class="mulligan-container">
        <div class="mulligan-header">
          <h2>MULLIGAN</h2>
          <p>Select cards to send back and draw new ones</p>
        </div>
        <div id="mulligan-hand" class="hand mulligan-hand"></div>
        <button id="mulligan-confirm" class="btn-primary">CONFIRM HAND</button>
      </div>
    </div>

    <!-- Main Board -->
    <div id="board" class="screen hidden">
      <div class="board-wrapper">
        <!-- Opponent side -->
        <div class="board-side opponent-side">
          <div id="opponent-area" class="player-area"></div>
        </div>

        <!-- Center battle zone -->
        <div class="center-zone">
          <div id="phase-bar" class="phase-bar"></div>
          <div id="battle-zone" class="battle-zone">
            <div id="battle-strip" class="battle-strip"></div>
            <div id="attack-animation" class="attack-animation"></div>
          </div>
        </div>

        <!-- Your side -->
        <div class="board-side your-side">
          <div id="you-area" class="player-area"></div>
          <div id="hand-area" class="hand your-hand"></div>
        </div>
      </div>

      <!-- Action bar -->
      <div id="action-bar" class="action-bar"></div>

      <!-- Event log -->
      <div id="log-panel" class="log-panel"></div>
    </div>

    <!-- Card Detail Modal -->
    <div id="card-detail-modal" class="modal hidden">
      <div class="modal-overlay"></div>
      <div class="card-detail-container">
        <button class="modal-close">✕</button>
        <div class="card-detail-content">
          <div class="card-detail-art">
            <div id="detail-card-art" class="card-art"></div>
          </div>
          <div class="card-detail-info">
            <div id="detail-card-name" class="detail-name"></div>
            <div id="detail-card-clan" class="detail-clan"></div>
            <div id="detail-card-grade" class="detail-grade"></div>
            <div class="detail-divider"></div>
            <div id="detail-card-stats" class="detail-stats"></div>
            <div id="detail-card-skill" class="detail-skill"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Reveal Overlay (ride/drive/damage checks) -->
    <div id="reveal-overlay" class="hidden">
      <div id="reveal-modal" class="reveal-modal">
        <div id="reveal-label" class="reveal-label"></div>
        <div id="reveal-card-wrap" class="reveal-card-wrap">
          <div id="reveal-card" class="card reveal-card"></div>
        </div>
        <div id="reveal-sub" class="reveal-sub"></div>
        <div id="reveal-hint" class="reveal-hint">click to continue</div>
      </div>
    </div>

    <!-- Toast stack -->
    <div id="toast-stack" class="toast-stack"></div>
  </div>
  <script src="client.js"></script>
</body>
</html>
